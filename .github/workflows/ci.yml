name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04            # ubuntu-latest (26.04) no longer ships Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff
      - run: ruff check src tests
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax
        run: for f in src/meshatlas/web/*.js; do node --check "$f"; done
