name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
        include:
          # The 2019 README promised Windows; keep checking paths and file names there.
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Offline: every test talks to tests/fake_site.py on 127.0.0.1, never to the real site.
      - run: python -m pytest --cov --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          ehentai-crawler --version
          ehentai-crawler --help > /dev/null
