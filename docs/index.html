<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildSite 3D — Interactive Residential Estate Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Architectural HUD Header */
    .hud-card {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 12px;
      padding: 16px 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      z-index: 10;
      max-width: 380px;
    }
    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #2dd4bf;
      border-radius: 50%;
      box-shadow: 0 0 10px #2dd4bf;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }
    .hud-subtitle {
      font-size: 13px;
      color: #94a3b8;
    }
    .hud-project {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-top: 10px;
    }
    .hud-milestone {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #2dd4bf);
    }
    /* Controls card */
    .controls-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 30px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .ctrl-hint {
      font-size: 13px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-toggle {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-toggle:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Top-Left Architectural HUD -->
  <div class="hud-card">
    <div class="hud-header">
      <div class="status-dot"></div>
      <div class="hud-title">BuildSite 3D</div>
      <div class="hud-subtitle">• @ATLURI0001</div>
    </div>
    <div class="hud-project">Active Architecture</div>
    <div class="hud-milestone">Master Luxury Residential Estate</div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:#94a3b8;">
      <span>Verified Contributions: <strong>5,207</strong></span>
      <span style="color:#2dd4bf; font-weight:700;">Prestige Unlocked</span>
    </div>
  </div>

  <!-- Bottom Interactive Controls Bar -->
  <div class="controls-card">
    <div class="ctrl-hint">
      <span>🖱️ <strong>Click & Drag</strong> to Rotate 360°</span>
    </div>
    <div class="ctrl-hint">
      <span>🔍 <strong>Scroll</strong> to Zoom</span>
    </div>
    <button class="btn-toggle" id="btn-lighting">🌙 Toggle Dusk / Day</button>
    <button class="btn-toggle" id="btn-auto-rotate">🔄 Auto-Rotate: ON</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    // Three.js 3D Architectural Scene Setup
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(28, 22, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera going below ground
    controls.minDistance = 10;
    controls.maxDistance = 80;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.target.set(0, 4, 0);

    // Lighting Setup
    const ambientLight = new THREE.AmbientLight(0x94a3b8, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5ea, 1.8);
    sunLight.position.set(25, 40, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 120;
    const d = 35;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Warm Interior Point Lights
    const interiorLight1 = new THREE.PointLight(0xffb347, 2.5, 18);
    interiorLight1.position.set(0, 3, 2);
    scene.add(interiorLight1);

    const interiorLight2 = new THREE.PointLight(0xffb347, 2.0, 18);
    interiorLight2.position.set(2, 7.5, 2);
    scene.add(interiorLight2);

    // Pool Submerged Cyan Light
    const poolLight = new THREE.PointLight(0x00ffff, 3.5, 14);
    poolLight.position.set(-6, 0.4, 6);
    scene.add(poolLight);

    // Materials
    const concreteMat = new THREE.MeshStandardMaterial({ color: 0xd8dadc, roughness: 0.65 });
    const plasterMat = new THREE.MeshStandardMaterial({ color: 0xf5f6f8, roughness: 0.45 });
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3d434c, roughness: 0.85 });
    const timberMat = new THREE.MeshStandardMaterial({ color: 0x8b5a36, roughness: 0.4 });
    const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.35 });
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x70c0e8,
      transparent: true,
      opacity: 0.45,
      roughness: 0.05,
      transmission: 0.7,
      ior: 1.52,
      reflectivity: 0.9
    });
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x00b4d8,
      transparent: true,
      opacity: 0.85,
      roughness: 0.1,
      transmission: 0.6,
      ior: 1.333
    });

    // 1. Manicured Lawn Ground
    const groundGeo = new THREE.PlaneGeometry(80, 80);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x4f8742, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 2. Concrete Foundation & Terraces
    const slabGeo = new THREE.BoxGeometry(22, 0.4, 16);
    const slab = new THREE.Mesh(slabGeo, concreteMat);
    slab.position.set(0, 0.2, 0);
    slab.receiveShadow = true;
    scene.add(slab);

    // 3. Ground Floor Main Living Mass
    const gfGeo = new THREE.BoxGeometry(16, 4.5, 11);
    const gf = new THREE.Mesh(gfGeo, plasterMat);
    gf.position.set(0, 2.45, 0);
    gf.castShadow = true;
    gf.receiveShadow = true;
    scene.add(gf);

    // 4. Cantilevered Upper Storey Mass
    const ffGeo = new THREE.BoxGeometry(17, 4.2, 10);
    const ff = new THREE.Mesh(ffGeo, plasterMat);
    ff.position.set(1.5, 6.8, 1);
    ff.castShadow = true;
    ff.receiveShadow = true;
    scene.add(ff);

    // 5. Slate Stone Anchor Wall
    const stoneWallGeo = new THREE.BoxGeometry(2.5, 9.2, 12);
    const stoneWall = new THREE.Mesh(stoneWallGeo, stoneMat);
    stoneWall.position.set(-8.5, 4.6, 0);
    stoneWall.castShadow = true;
    stoneWall.receiveShadow = true;
    scene.add(stoneWall);

    // 6. Panoramic Floor-to-Ceiling Glass Panels
    const glassGeo = new THREE.BoxGeometry(11, 4.0, 0.2);
    const glassGf = new THREE.Mesh(glassGeo, glassMat);
    glassGf.position.set(0, 2.3, 5.5);
    scene.add(glassGf);

    const glassFf = new THREE.Mesh(new THREE.BoxGeometry(12, 3.8, 0.2), glassMat);
    glassFf.position.set(1.5, 6.8, 6.0);
    scene.add(glassFf);

    // 7. Cedar Louvers
    for (let lx = 3; lx < 8.5; lx += 0.8) {
      const louver = new THREE.Mesh(new THREE.BoxGeometry(0.35, 3.8, 0.15), timberMat);
      louver.position.set(lx, 6.8, 6.15);
      louver.castShadow = true;
      scene.add(louver);
    }

    // 8. Flat Roof Fascias
    const roofFascia = new THREE.Mesh(new THREE.BoxGeometry(18.5, 0.35, 11.5), darkMetalMat);
    roofFascia.position.set(1.5, 9.0, 1);
    roofFascia.castShadow = true;
    scene.add(roofFascia);

    // 9. Swimming Pool & Teak Deck
    const deckGeo = new THREE.BoxGeometry(11, 0.3, 9);
    const deck = new THREE.Mesh(deckGeo, timberMat);
    deck.position.set(-6, 0.35, 6);
    deck.receiveShadow = true;
    scene.add(deck);

    const poolWaterGeo = new THREE.PlaneGeometry(8, 6);
    const poolWater = new THREE.Mesh(poolWaterGeo, waterMat);
    poolWater.rotation.x = -Math.PI / 2;
    poolWater.position.set(-6, 0.45, 6);
    scene.add(poolWater);

    // 10. Garage Pavilion & Driveway
    const garage = new THREE.Mesh(new THREE.BoxGeometry(7, 4.2, 9), plasterMat);
    garage.position.set(11.5, 2.3, -1);
    garage.castShadow = true;
    garage.receiveShadow = true;
    scene.add(garage);

    const garageDoor = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.5, 0.2), darkMetalMat);
    garageDoor.position.set(11.5, 2.0, 3.5);
    scene.add(garageDoor);

    // 11. Italian Cypress Trees
    function createCypress(x, z, height) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2, 8), new THREE.MeshStandardMaterial({ color: 0x4a3525 }));
      trunk.position.y = 1;
      trunk.castShadow = true;
      group.add(trunk);

      const foliageMat = new THREE.MeshStandardMaterial({ color: 0x24552b, roughness: 0.9 });
      const foliage = new THREE.Mesh(new THREE.ConeGeometry(1.4, height, 10), foliageMat);
      foliage.position.y = height / 2 + 1;
      foliage.castShadow = true;
      group.add(foliage);

      group.position.set(x, 0, z);
      scene.add(group);
    }
    createCypress(-14, -6, 12);
    createCypress(-14, 0, 14);
    createCypress(-14, 6, 13);
    createCypress(18, -4, 11);
    createCypress(18, 4, 12);

    // 12. Tennis Court (Master Estate Tier)
    const courtGeo = new THREE.PlaneGeometry(16, 10);
    const courtMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.6 });
    const court = new THREE.Mesh(courtGeo, courtMat);
    court.rotation.x = -Math.PI / 2;
    court.position.set(12, 0.05, -12);
    court.receiveShadow = true;
    scene.add(court);

    // Animation Loop
    let isDusk = true;
    function updateLighting() {
      if (isDusk) {
        scene.background.set(0x0f172a);
        scene.fog.color.set(0x0f172a);
        sunLight.color.set(0xff9944);
        sunLight.intensity = 0.8;
        ambientLight.intensity = 0.4;
        interiorLight1.intensity = 3.0;
        interiorLight2.intensity = 2.5;
        poolLight.intensity = 4.0;
      } else {
        scene.background.set(0x87ceeb);
        scene.fog.color.set(0xb0e0e6);
        sunLight.color.set(0xfff8ee);
        sunLight.intensity = 2.2;
        ambientLight.intensity = 0.8;
        interiorLight1.intensity = 0.5;
        interiorLight2.intensity = 0.5;
        poolLight.intensity = 1.0;
      }
    }
    updateLighting();

    document.getElementById("btn-lighting").addEventListener("click", () => {
      isDusk = !isDusk;
      document.getElementById("btn-lighting").textContent = isDusk ? "🌙 Toggle Dusk / Day" : "☀️ Toggle Day / Dusk";
      updateLighting();
    });

    let autoRotate = true;
    document.getElementById("btn-auto-rotate").addEventListener("click", () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      document.getElementById("btn-auto-rotate").textContent = autoRotate ? "🔄 Auto-Rotate: ON" : "⏸️ Auto-Rotate: OFF";
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
