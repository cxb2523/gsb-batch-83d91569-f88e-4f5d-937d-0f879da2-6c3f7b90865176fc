[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gather-radar"
version = "0.1.0"
description = "Event discovery for small communities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5,<3.2",
  "persiantools>=6.2,<7.0",
  "PyYAML>=6.0,<7.0",
  "instaloader>=4.15.3,<5.0",
  "playwright>=1.62.0,<2.0",
  "python-telegram-bot>=22.5,<23.0",
]

[project.optional-dependencies]
google-sheets = [
  "google-api-python-client>=2.200,<3.0",
  "google-auth-httplib2>=0.4.2,<0.5",
  "google-auth-oauthlib>=1.4.1,<2.0",
]

# Optional local OCR fallback engine (Persian + English). Not required by the core MVP;
# Tesseract and Windows OCR need no Python package.
ocr-easyocr = [
  "easyocr>=1.7,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
