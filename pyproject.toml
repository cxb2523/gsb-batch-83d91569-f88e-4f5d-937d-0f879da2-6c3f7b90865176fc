[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "meshatlas"
dynamic = ["version"]
description = "A live HUD-style map of your Tailscale tailnet: where every node is, how it is connected (direct / DERP / peer relay), and what runs on it. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.9"
authors = [{ name = "MeshAtlas contributors" }]
keywords = ["tailscale", "tailnet", "wireguard", "network-map", "monitoring", "homelab", "selfhosted", "derp", "latency"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "tomli>=1.1; python_version < '3.11'",   # TOML config on old Pythons; nothing at all on 3.11+
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/lij768423-svg/meshatlas"
Issues = "https://github.com/lij768423-svg/meshatlas/issues"

[project.scripts]
meshatlas = "meshatlas.cli:main"

[tool.hatch.version]
path = "src/meshatlas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/meshatlas"]

[tool.hatch.build.targets.sdist]
include = ["src/meshatlas", "tests", "examples", "README.md", "README.zh-CN.md", "LICENSE", "NOTICE.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["meshatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
