; ehentai-crawler settings.
;
; Copy this file to setting.ini (git ignores setting.ini) and change what you need;
; anything you leave out keeps the value shown here. Every key can also be set as an
; environment variable EHENTAI_<KEY> (EHENTAI_EX_MODE=false), and most as a flag
; (--no-ex-mode). Flags beat environment variables, which beat this file.

[Mode]
; True: crawl ExHentai (needs the two cookies below). False: crawl E-Hentai.
EX_MODE = True
; http: plain HTTP requests. browser: Chrome through Selenium
; (pip install "ehentai-crawler[browser]"; Selenium fetches a matching ChromeDriver itself).
FETCHER = http
; Hide the Chrome window (browser fetcher only).
HEADLESS = False

[HentaiUrl]
EHENTAI_INDEX = https://e-hentai.org/
EHENTAI_GALLERY = https://e-hentai.org/g/
EXHENTAI_INDEX = https://exhentai.org/
EXHENTAI_GALLERY = https://exhentai.org/g/

[ExHentaiAccess]
; Your ExHentai login cookies (from the browser after logging in to e-hentai.org).
; Prefer the environment variables EHENTAI_IPB_MEMBER_ID and EHENTAI_IPB_PASS_HASH,
; and never commit real values.
IPB_MEMBER_ID =
IPB_PASS_HASH =

[Parallel]
; Galleries crawled at the same time. REQUEST_DELAY below still sets the pace per host.
NUMBER_OF_THREAD = 24

[Politeness]
; Minimum seconds between two requests to the same host, plus a random extra of up to
; the same amount (so 1.0 means 1-2 s).
REQUEST_DELAY = 1.0
; Retries for timeouts and server errors; waits 5 s, 10 s, 20 s, ... (at most 300 s).
MAX_RETRIES = 5
; Seconds to wait for one response.
TIMEOUT = 60
; USER_AGENT = ehentai-crawler/<version> (+https://github.com/NatLee/ehentai-crawler)

[ImageFolder]
; Images are saved as <IMAGE_FOLDER_PATH>/<gallery id>/<original file name>.
IMAGE_FOLDER_PATH = img

[Database]
DATABASE_PATH = list.db

[Logging]
; DEBUG, INFO, WARNING or ERROR.
LOG_LEVEL = INFO
